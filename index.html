// ==================== CUTSCENE ====================

function drawCut(){
  cf++;
  dr(0,0,W,H,'#fff');

// ==================== GAME UPDATE ====================

function updateGame(){
  f++;
  var totalDur=sections.reduce(function(a,s){return a+s.dur;},0);
  progress+=1/totalDur;
  var accum=0;var idx=0;
  for(var i=0;i<sections.length;i++){
    accum+=sections[i].dur;
    if(progress<accum/totalDur){idx=i;break;}
    if(i>=sections.length-1)idx=i;
  }
  if(currentSectionIndex!==idx){
    currentSectionIndex=idx;curSectionProgress=0;stage=idx;
  }
  curSectionProgress++;
  var sec=sections[idx];
  if(progress<0.01){safeWidth=0.38;flowSpeed=0.5;centerOffset=0;}
  else{
    var t=Math.sin(Math.min(1,curSectionProgress/sec.dur)*Math.PI);
    safeWidth=0.42-(0.42-sec.narrow)*t;
    flowSpeed=sec.speed*(0.5+0.5*t);
    centerOffset=sec.offset*t;
  }
  center=0.5+centerOffset;
  var input=0;
  if(touchL)input=-1;
  if(touchR)input=1;
  stone.target+=input*0.012;
  stone.target=Math.max(0,Math.min(1,stone.target));
  stone.pos+=(stone.target-stone.pos)*0.08;
  stone.target+=Math.sin(f*0.08)*flowSpeed*0.004+Math.sin(f*0.2+1)*flowSpeed*0.003;
  stone.target=Math.max(0,Math.min(1,stone.target));
  
  var halfSafe=safeWidth/2;
  var sd=Math.abs(stone.pos-center);
  if(sd>halfSafe){
    outsideTimer++;
    if(outsideTimer%3===0){hp=Math.max(0,hp-1);if(Math.random()<0.3)
      particles.push({x:W/2+(stone.pos-0.5)*W*0.4,y:300,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-2,life:15,size:2});
      if(hp<=0){alive=false;gameOver(false);return;}
    }
  } else {
    if(outsideTimer>0)outsideTimer=Math.max(0,outsideTimer-2);
  }
  if(progress>=1){won=true;gameOver(true);return;}
  if(f%3===0)particles.push({x:Math.random()*W,y:H+10,vy:-(1+Math.random()*flowSpeed*0.5),vx:(Math.random()-0.5)*2,life:60,size:1+Math.random()*2});
  if(f%6===0&&hp>0){
    var sx=W/2+(stone.pos-0.5)*W;
    for(var j=0;j<2;j++)particles.push({x:sx-12+Math.random()*24,y:320+Math.random()*20,vx:(Math.random()-0.5)*2,vy:-(1+Math.random()*2),life:15+Math.random()*10,size:2});
  }
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}

  ctx.closePath();
  ctx.fill();
  
  ctx.restore();
}

  if(safeX<barX+2)safeX=barX+2;if(safeX+safePx>barX+barW-2)safeX=barX+barW-2-safePx;
  dr(safeX,barY+2,safePx,barH-4,'#000');
  ctx.fillStyle='#888';ctx.font='11px monospace';ctx.fillText('安全区',safeX+4,barY+15);
  ctx.fillStyle='#aaa';ctx.font='10px monospace';ctx.fillText('管壁',barX+2,barY+barH+18);ctx.fillText('管壁',barX+barW-18,barY+barH+18);
  var curX=barX+stone.pos*barW;
  dr(curX-4,barY-4,8,barH+8,'#666');dr(curX-2,barY-2,4,barH+4,'#000');
  ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(curX-4,barY+barH+4);ctx.lineTo(curX+4,barY+barH+4);ctx.lineTo(curX,barY+barH+8);ctx.closePath();ctx.fill();
  
  // Labels
  if(currentSectionIndex>=0){
    ctx.fillStyle='#555';ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText(anatomyInfo[currentSectionIndex],240,68);ctx.textAlign='left';
  }
  dr(30,82,180,10,'#000');dr(30,82,180,10,'#ddd');dr(30,82,Math.floor(180*hp/100),10,hp>40?'#000':'#666');
  ctx.fillStyle='#000';ctx.font='bold 12px monospace';ctx.fillText('HP '+hp+'/100',220,92);
  
  // Wall scrape
  var sd=Math.abs(stone.pos-center);
  if(sd>safeWidth/2){
    var d=Math.min(1,(sd-safeWidth/2)/(1-safeWidth/2));
    dr(0,0,W,H,'rgba(0,0,0,'+(0.05+d*0.15)+')');
  }
  
  // Progress bar bottom
  var pbY=H-100,pbX=40,pbW=400,pbH=20;
  dr(pbX-1,pbY-1,pbW+2,pbH+2,'#000');dr(pbX,pbY,pbW,pbH,'#ddd');
  dr(pbX,pbY,Math.min(pbW,Math.floor(progress*pbW)),pbH,'#000');
  var cum=0;
  for(var i=0;i<sections.length;i++){cum+=sections[i].dur;
    var px2=pbX+Math.floor(cum/3600*pbW);
    ctx.fillStyle='#555';ctx.font='7px monospace';ctx.fillText('|',px2-1,pbY+pbH-2);}
  ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
  ctx.fillText(Math.min(100,Math.floor(progress*100))+'%',pbX+pbW/2,pbY+15);ctx.textAlign='left';
  
  var modeLabel=gameMode==='normal'?'常规模式':(gameMode==='elderly_male'?'👴 老年（男）':'👵 老年（女）');
  if(currentSectionIndex>=0){
    ctx.fillStyle='#888';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText(modeLabel+' · 第'+(currentSectionIndex+1)+'/'+sections.length+'关 · '+sections[currentSectionIndex].name,240,barY-85);
    ctx.textAlign='left';
  }
  
  // Particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];if(p.life>0){ctx.fillStyle='rgba(0,0,0,'+(0.1+0.2*p.life/60)+')';
      ctx.beginPath();ctx.arc(p.x,p.y,p.size||2,0,Math.PI*2);ctx.fill();}
  }
}

// ==================== GAME OVER ====================

function gameOver(win){
  state='end';
  document.getElementById('controls').classList.remove('show');
  document.getElementById('elderlyTag').classList.remove('show');
  
  var elderlySuffix='';
  if(gameMode==='elderly_male')elderlySuffix='（老年·男性·前列腺增生）';
  
  if(win){
    document.getElementById('resultTitle').textContent='🎉 通关成功！';
    var msg='结石成功排出体外！';
    if(gameMode!=='normal')msg+='  '+elderlySuffix;
    document.getElementById('resultMsg').textContent=msg;
    
    if(gameMode==='normal'){
      document.getElementById('resultAnatomy').textContent='输尿管3处狭窄+尿道3处狭窄，6道关卡全部通过。';
      document.getElementById('ageCompare').style.display='none';
    } else if(gameMode==='elderly_male'){
      document.getElementById('resultAnatomy').textContent='老年男性：输尿管3处狭窄+前列腺增生+尿道3处狭窄，7道关卡全部通过！';
      document.getElementById('ageCompare').style.display='block';
      document.getElementById('ageCompare').innerHTML=
        '<strong>📊 年龄对比</strong><br>'+
        '常规模式：蠕动速度正常 · 6处狭窄<br>'+
        '老年模式：蠕动速度降低20% · 7处狭窄（含前列腺增生压迫段）<br>'+
        '⚠️ 前列腺增生使尿道内口及前列腺部尿道显著变窄';
    } else {
      document.getElementById('resultAnatomy').textContent='老年女性：输尿管3处狭窄+尿道3处狭窄，蠕动减弱，6道关卡全部通过！';
      document.getElementById('ageCompare').style.display='block';
      document.getElementById('ageCompare').innerHTML=
        '<strong>📊 年龄对比</strong><br>'+
        '常规模式：蠕动速度正常 · 6处狭窄<br>'+
        '老年模式：蠕动速度降低约20% · 6处狭窄<br>'+
        '💪 输尿管蠕动随年龄增长而减弱，排石时间延长';
    }
  } else {
    var sec=sections[currentSectionIndex]||{name:'输尿管'};
    document.getElementById('resultTitle').textContent='💥 结石卡住了！';
    document.getElementById('resultMsg').textContent='卡在：'+sec.name+'  '+elderlySuffix;
    document.getElementById('resultAnatomy').textContent=anatomyInfo[currentSectionIndex]||'需要重新尝试。';
    document.getElementById('ageCompare').style.display='none';
  }
  document.getElementById('result').classList.add('show');
}

// ==================== START / RESTART ====================

function startGame(mode){
  gameMode=mode;
  // Select sections based on mode
  if(mode==='normal'){
    sections=normalSections;
    anatomyInfo=normalAnatomy;
  } else if(mode==='elderly_male'){
    sections=elderlyMaleSections;
    anatomyInfo=elderlyMaleAnatomy;
  }
  // (female elderly mode removed - 6 narrow passages are male-specific)
  document.getElementById('screen').style.display='none';
  state='cut';cf=0;
}

function restart(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('screen').style.display='flex';
  document.getElementById('ageCompare').style.display='none';
  state='menu';
}

function loop(){
  dr(0,0,W,H,'#fff');
  if(state==='cut')drawCut();
  else if(state==='play'){updateGame();drawGame();}
  requestAnimationFrame(loop);
}
loop();
</script>
